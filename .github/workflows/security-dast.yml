name: Security DAST

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dast:
    name: DAST
    # After a successful publish from a push, wait until the site serves that commit;
    # scheduled and manual runs scan what is already live.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    uses: alexis1986/security-workflows/.github/workflows/dast.yml@v1.0.0
    with:
      mode: report
      target-url: https://alexdevvv.com
      wait-url: https://alexdevvv.com/version.txt
      wait-for: ${{ github.event.workflow_run.head_sha || '' }}
      wait-timeout-minutes: 15
