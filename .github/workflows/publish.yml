name: Publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: E2E (includes build and launch-readiness)
        run: pnpm test:e2e

  secrets:
    name: Secrets
    permissions:
      contents: read
      security-events: write
    uses: alexis1986/security-workflows/.github/workflows/secrets.yml@main
    with:
      mode: report
      upload-sarif: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      artifact-name: secrets-report

  sca:
    name: Dependencies
    permissions:
      contents: read
      security-events: write
    uses: alexis1986/security-workflows/.github/workflows/sca.yml@main
    with:
      mode: report
      upload-sarif: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      artifact-name: sca-report

  sast:
    name: SAST
    permissions:
      contents: read
      security-events: write
    uses: alexis1986/security-workflows/.github/workflows/sast.yml@main
    with:
      mode: report
      upload-sarif: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      artifact-name: sast-report

  iac:
    name: IaC
    permissions:
      contents: read
      security-events: write
    uses: alexis1986/security-workflows/.github/workflows/iac.yml@main
    with:
      mode: report
      upload-sarif: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      artifact-name: iac-report

  # Builds the image, scans it and, on push to main only, pushes that same
  # scanned image (no rebuild). Pull requests build and scan without pushing.
  image-scan:
    name: Image scan and push
    needs: [ci, secrets, sca, sast, iac]
    # Report-mode baseline window: scanner tool errors must not stop deploys, so
    # the job runs even if a scan layer failed (only CI must pass). Revert to
    # plain `needs` gating when the layers flip to enforce (Phase 4).
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    permissions:
      contents: read
      security-events: write
      packages: write
    uses: alexis1986/security-workflows/.github/workflows/image-scan.yml@main
    with:
      mode: report
      upload-sarif: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      image-name: portfolio-site
      artifact-name: image-report
      push: ${{ github.event_name == 'push' }}
      push-tags: |
        ghcr.io/alexis1986/portfolio-site:latest
        ghcr.io/alexis1986/portfolio-site:sha-${{ github.sha }}

  sign-sbom:
    name: SBOM and signature
    needs: image-scan
    # Same baseline-window rule as image-scan: revert to plain `needs` gating in Phase 4.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.image-scan.result == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: alexis1986/security-workflows/.github/workflows/sign-sbom.yml@main
    with:
      image-ref: ghcr.io/alexis1986/portfolio-site@${{ needs.image-scan.outputs.digest }}
      signing: keyless
